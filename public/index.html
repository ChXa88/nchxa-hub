<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>nchxa · Các website của mình</title>
<meta name="description" content="Nơi tập hợp các website của mình: học IELTS, học HTML, rút gọn link và nhiều hơn nữa.">
<meta property="og:title" content="nchxa · Các website của mình">
<meta property="og:description" content="Tìm và mở nhanh mọi website trong một chỗ.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#3B3FEF">
<link rel="icon" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#EDF0F7;--card:#fff;--ink:#12182B;--mute:#5B647C;--line:#D9DEEA;--brand:#3B3FEF;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#0E1220;--card:#171C2F;--ink:#E8ECF8;--mute:#9AA3BE;--line:#283050;--brand:#8B8FFF}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 "Be Vietnam Pro",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
:focus-visible{outline:3px solid var(--brand);outline-offset:3px}
header{display:flex;justify-content:space-between;align-items:center;padding:22px 0}
.logo{font:800 24px "Bricolage Grotesque",sans-serif;letter-spacing:-.04em;text-decoration:none}
header a.go{font-weight:500;font-size:15px;color:var(--mute);text-decoration:none}
header a.go:hover{color:var(--brand)}
.hero{padding:9vh 0 36px}
h1{font:800 clamp(40px,8.4vw,92px)/.98 "Bricolage Grotesque",sans-serif;letter-spacing:-.045em;margin:0;max-width:11em}
.hero p{color:var(--mute);font-size:18px;margin:18px 0 30px;max-width:34em}
.search{position:relative;max-width:620px}
.search input{width:100%;font:500 19px "Be Vietnam Pro",sans-serif;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:16px;padding:17px 64px 17px 20px;transition:border-color .15s,box-shadow .15s}
.search input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 5px color-mix(in srgb,var(--brand) 18%,transparent)}
kbd{position:absolute;right:16px;top:50%;transform:translateY(-50%);font:600 14px "Be Vietnam Pro",sans-serif;color:var(--mute);border:1px solid var(--line);border-bottom-width:3px;border-radius:8px;padding:2px 9px;background:var(--bg)}
.hint{min-height:26px;margin:10px 4px 0;font-size:14px;color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px;padding:14px 0 70px}
.tile{--c:var(--brand);display:flex;flex-direction:column;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;text-decoration:none;transition:transform .18s,border-color .18s,box-shadow .18s;animation:in .5s both;animation-delay:calc(var(--i)*70ms)}
.tile:hover,.tile.pick{border-color:var(--c);transform:translateY(-3px);box-shadow:0 14px 30px -18px var(--c)}
.tile.pick{box-shadow:0 0 0 2px var(--c)}
.mono{width:54px;height:54px;border-radius:16px;background:var(--c);color:#fff;display:grid;place-items:center;font:800 21px "Bricolage Grotesque",sans-serif;letter-spacing:-.03em}
.tile h2{font:700 22px "Bricolage Grotesque",sans-serif;letter-spacing:-.03em;margin:0}
.tile p{margin:0;color:var(--mute);font-size:15px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
.meta span{font-size:13px;color:var(--mute);border:1px solid var(--line);border-radius:99px;padding:1px 10px}
.empty{grid-column:1/-1;color:var(--mute);padding:30px 0}
footer{border-top:1px solid var(--line);padding:22px 0 34px;color:var(--mute);font-size:14px}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
@media(prefers-reduced-motion:reduce){.tile{animation:none;transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header><a class="logo" href="/">nchxa</a><a class="go" href="/admin/">Rút gọn link</a></header>
  <main>
    <section class="hero">
      <h1>Mọi website của mình, một chỗ để mở.</h1>
      <p>Gõ tên để lọc, nhấn Enter để vào ngay website đầu tiên trong danh sách.</p>
      <div class="search">
        <input id="q" type="search" placeholder="Tìm website…" autocomplete="off" aria-label="Tìm website" autofocus>
        <kbd aria-hidden="true">/</kbd>
      </div>
      <div class="hint" id="hint" aria-live="polite"></div>
    </section>
    <section class="grid" id="grid" aria-label="Danh sách website"></section>
  </main>
  <footer>© <span id="y"></span> nchxa.cyou</footer>
</div>
<script>
const $=s=>document.querySelector(s),grid=$("#grid"),q=$("#q"),hint=$("#hint");
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm=s=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/g,"d");
let sites=[];
$("#y").textContent=new Date().getFullYear();
function render(){
  const k=norm(q.value.trim());
  const list=sites.filter(s=>norm([s.name,s.desc,...s.tags].join(" ")).includes(k));
  grid.innerHTML=list.length?list.map((s,i)=>`<a class="tile${k&&!i?" pick":""}" style="--c:${esc(s.color)};--i:${i}" href="${esc(s.url)}">
    <div class="mono" aria-hidden="true">${esc(s.mono)}</div><h2>${esc(s.name)}</h2><p>${esc(s.desc)}</p>
    <div class="meta">${s.tags.map(t=>`<span>${esc(t)}</span>`).join("")}</div></a>`).join(""):`<p class="empty">Không có website nào khớp với “${esc(q.value)}”.</p>`;
  hint.textContent=k&&list.length?`Enter để mở ${list[0].name}`:"";
}
q.addEventListener("input",render);
q.addEventListener("keydown",e=>{if(e.key==="Enter"){const a=grid.querySelector(".tile");if(a)location.href=a.href}if(e.key==="Escape"){q.value="";render()}});
addEventListener("keydown",e=>{if(e.key==="/"&&document.activeElement!==q){e.preventDefault();q.focus()}});
fetch("/sites.json").then(r=>r.json()).then(d=>{sites=d;render()}).catch(()=>grid.innerHTML='<p class="empty">Không tải được danh sách website. Hãy thử tải lại trang.</p>');
</script>
</body>
</html>
