<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Rút gọn link · nchxa</title>
<link rel="icon" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#EDF0F7;--card:#fff;--ink:#12182B;--mute:#5B647C;--line:#D9DEEA;--brand:#3B3FEF;--on:#fff;--ok:#12805C;--bad:#C8322B;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#0E1220;--card:#171C2F;--ink:#E8ECF8;--mute:#9AA3BE;--line:#283050;--brand:#8B8FFF;--on:#0E1220;--ok:#4CC9A0;--bad:#FF8A80}}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "Be Vietnam Pro",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:900px;margin:0 auto;padding:0 20px 80px}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
h1,.logo{font-family:"Bricolage Grotesque",sans-serif;letter-spacing:-.04em}
.top{display:flex;justify-content:space-between;align-items:center;padding:20px 0}
.logo{font-weight:800;font-size:24px;text-decoration:none;color:inherit}
h1{font-size:clamp(34px,6vw,54px);line-height:1;margin:18px 0 8px;font-weight:800}
.sub{color:var(--mute);margin:0 0 24px}
input{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%}
input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 4px color-mix(in srgb,var(--brand) 20%,transparent)}
.btn{font:600 14px "Be Vietnam Pro",sans-serif;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 14px;border-radius:10px;cursor:pointer}
.btn:hover{border-color:var(--brand)}
.btn.pri{background:var(--brand);color:var(--on);border-color:var(--brand);padding:13px 22px;font-size:16px}
.btn.del:hover{border-color:var(--bad);color:var(--bad)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px}
.login{max-width:380px;margin:0 0 20px;display:grid;gap:12px}
body.guest .adm,body.guest .sw,body.guest .clicks,body.guest [data-a=edit],body.guest [data-a=del]{display:none!important}
.err{color:var(--bad);font-size:14px;min-height:20px;margin:0}
.make{display:grid;gap:12px}
.make .r2{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:12px}
.make label{display:grid;gap:4px;font-size:13px;color:var(--mute);font-weight:500}
.make .go{display:flex;gap:12px;align-items:center;justify-content:space-between}
.pre{display:flex;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding-left:12px;color:var(--mute);font-size:14px}
.pre input{border:0;box-shadow:none!important;padding-left:2px;background:none}
.bar{display:flex;justify-content:space-between;align-items:center;gap:14px;margin:32px 0 12px}
.bar input{max-width:360px}.bar span{color:var(--mute);font-size:14px}
ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.row{display:grid;grid-template-columns:1fr auto auto;gap:6px 18px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.row.off{opacity:.55}
.short{font:700 17px "Bricolage Grotesque",sans-serif;letter-spacing:-.02em;color:var(--brand);background:none;border:0;padding:0;cursor:pointer;text-align:left}
.dest{margin:2px 0 0;font-size:13px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:46ch}
.clicks{text-align:center;font-size:12px;color:var(--mute);line-height:1.2}.clicks b{display:block;font:800 22px "Bricolage Grotesque",sans-serif;color:var(--ink)}
.acts{display:flex;gap:6px;align-items:center}.acts .btn{padding:7px 11px}
.tag{font-size:12px;border:1px solid var(--line);border-radius:99px;padding:0 8px;color:var(--mute);margin-left:6px;font-weight:500}
.sw{position:relative;width:42px;height:24px;flex:none}.sw input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:1}
.sw i{position:absolute;inset:0;background:var(--line);border-radius:99px;transition:.15s}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s}
.sw input:checked+i{background:var(--ok)}.sw input:checked+i::after{transform:translateX(18px)}
.sw input:focus-visible+i{outline:3px solid var(--brand);outline-offset:2px}
.empty{text-align:center;color:var(--mute);padding:36px 10px}
dialog{border:1px solid var(--line);border-radius:20px;background:var(--card);color:var(--ink);padding:24px;width:min(440px,92vw)}
dialog::backdrop{background:#0008}dialog form{display:grid;gap:12px}dialog h2{margin:0;font:800 24px "Bricolage Grotesque",sans-serif}
.qr svg{width:240px;height:240px;border-radius:12px;display:block;margin:0 auto}.qr p{text-align:center;word-break:break-all;color:var(--mute);font-size:14px}
.btns{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;font-weight:500;font-size:15px;opacity:0;pointer-events:none;transition:.2s;max-width:92vw}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:700px){.make .r2{grid-template-columns:1fr}.row{grid-template-columns:1fr auto}.acts{grid-column:1/-1}.dest{max-width:28ch}.bar{flex-direction:column;align-items:stretch}.bar input{max-width:none}}
</style>
</head>
<body>
<div class="wrap">

  <div id="dash">
    <div class="top"><a class="logo" href="/">nchxa</a><button class="btn" id="out">Đăng nhập quản trị</button></div>
  <form id="login" class="login card" hidden>
    <h2 style="font:800 26px 'Bricolage Grotesque',sans-serif;margin:0">Đăng nhập quản trị</h2>
    <p class="sub" style="margin:0">Để xem, sửa, đặt alias hoặc xoá mọi link.</p>
    <input id="pw" type="password" placeholder="Mật khẩu quản trị" autocomplete="current-password" required>
    <p class="err" id="lerr" role="alert"></p>
    <button class="btn pri">Đăng nhập</button>
  </form>

    <h1>Rút gọn link</h1>
    <p class="sub">Dán link dài, nhận link ngắn đã được sao chép sẵn để gửi đi. Không cần đăng nhập.</p>
    <form id="make" class="card make">
      <label>Link cần rút gọn<input id="url" type="text" inputmode="url" placeholder="https://vocab.nchxa.cyou/..." required autofocus></label>
      <div class="r2 adm">
        <label>Alias (tuỳ chọn)<span class="pre"><span id="host"></span>/<input id="slug" placeholder="tự tạo" maxlength="40" autocomplete="off"></span></label>
        <label>Tiêu đề (tuỳ chọn)<input id="title" maxlength="60" placeholder="Ví dụ: Bài 1 IELTS"></label>
        <label>Hết hạn (tuỳ chọn)<input id="exp" type="date"></label>
      </div>
      <div class="go"><span class="err" id="merr" role="alert"></span><button class="btn pri">Rút gọn và sao chép</button></div>
    </form>
    <div class="bar adm"><input id="q" type="search" placeholder="Tìm theo alias, tiêu đề hoặc link đích" aria-label="Tìm link"><span id="stats"></span></div>
    <ul id="list"></ul>
  </div>
</div>

<dialog id="edlg"><form id="edit" method="dialog">
  <h2>Sửa link</h2><label>Link đích<input id="eurl" required></label>
  <label>Tiêu đề<input id="etitle" maxlength="60"></label><label>Hết hạn<input id="eexp" type="date"></label>
  <p class="err" id="eerr"></p><div class="btns"><button type="button" class="btn" data-close>Huỷ</button><button class="btn pri" style="padding:9px 18px;font-size:15px">Lưu</button></div>
</form></dialog>
<dialog id="qdlg" class="qr"><h2 style="text-align:center;margin-bottom:12px">Mã QR</h2><div id="qsvg"></div><p id="qtxt"></p>
  <div class="btns" style="justify-content:center"><button class="btn" id="qdl">Tải SVG</button><button class="btn" data-close>Đóng</button></div></dialog>
<div id="toast" role="status"></div>

<script>
const $=s=>document.querySelector(s),H=location.host;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ymd=ms=>{const d=new Date(ms);return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`};
const endOf=v=>v?new Date(v+"T23:59:59").getTime():null;
let links=[],editing=null,qrSlug=null,admin=false;
const mine=()=>{try{return JSON.parse(localStorage.getItem("mine")||"[]")}catch{return[]}};
const keep=r=>{try{localStorage.setItem("mine",JSON.stringify([r,...mine()].slice(0,50)))}catch{}};
$("#host").textContent=H;

async function api(path,method="GET",body){
  const r=await fetch("/api/"+path,{method,headers:{"Content-Type":"application/json"},body:body&&JSON.stringify(body)});
  const d=await r.json().catch(()=>({}));
  if(r.status===401&&admin)setAdmin(false);
  if(!r.ok)throw new Error(d.error||"Có lỗi xảy ra");
  return d;
}
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("show"),2400)}
const copy=async t=>{try{await navigator.clipboard.writeText(t);return true}catch{return false}};
const full=s=>`https://${H}/${s}`;
function setAdmin(ok){
  admin=ok;document.body.classList.toggle("guest",!ok);$("#login").hidden=true;
  $("#out").textContent=ok?"Đăng xuất":"Đăng nhập quản trị";
  if(ok)load();else{links=mine();render()}
}

async function load(){
  try{links=await api("links");render()}catch(e){if(admin)toast(e.message)}
}
function render(){
  const k=$("#q").value.trim().toLowerCase(),now=Date.now();
  const list=links.filter(l=>(l.slug+" "+(l.title||"")+" "+l.url).toLowerCase().includes(k));
  $("#stats").textContent=`${links.length} link · ${links.reduce((a,l)=>a+(l.c||0),0)} lượt bấm`;
  $("#list").innerHTML=list.length?list.map(l=>{
    const dead=l.exp&&l.exp<now;
    return`<li class="row${l.on&&!dead?"":" off"}" data-s="${esc(l.slug)}">
    <div><button class="short" data-a="copy" title="Sao chép">${esc(H)}/${esc(l.slug)}</button>${l.pub&&admin?'<span class="tag">Tạo từ khách</span>':""}${dead?'<span class="tag">Đã hết hạn</span>':l.exp?`<span class="tag">Hết hạn ${new Date(l.exp).toLocaleDateString("vi-VN")}</span>`:""}
    <p class="dest">${l.title?`<b>${esc(l.title)}</b> · `:""}${esc(l.url)}</p></div>
    <div class="clicks"><b>${l.c||0}</b>lượt bấm</div>
    <label class="sw" title="Bật/tắt link"><input type="checkbox" data-a="toggle" aria-label="Bật hoặc tắt link"${l.on?" checked":""}><i></i></label>
    <div class="acts"><button class="btn" data-a="qr">QR</button><button class="btn" data-a="edit">Sửa</button><button class="btn del" data-a="del">Xoá</button></div></li>`}).join("")
    :`<li class="empty">${links.length?"Không có link nào khớp.":"Chưa có link nào. Link bạn tạo trên thiết bị này sẽ hiện ở đây."}</li>`;
}

$("#login").onsubmit=async e=>{e.preventDefault();$("#lerr").textContent="";
  try{await api("login","POST",{password:$("#pw").value});$("#pw").value="";setAdmin(true)}catch(x){$("#lerr").textContent=x.message}};
$("#out").onclick=async()=>{
  if(admin){await api("logout","POST").catch(()=>{});setAdmin(false)}
  else{$("#login").hidden=!$("#login").hidden;$("#pw").focus()}};

$("#make").onsubmit=async e=>{e.preventDefault();$("#merr").textContent="";
  try{
    const r=admin?await api("links","POST",{url:$("#url").value,slug:$("#slug").value,title:$("#title").value,exp:endOf($("#exp").value)})
      :await api("shorten","POST",{url:$("#url").value});
    e.target.reset();if(admin)links.unshift(r);else{keep(r);links=mine()}render();
    toast(await copy(full(r.slug))?`Đã sao chép ${H}/${r.slug}`:`Đã tạo ${H}/${r.slug}`);
  }catch(x){$("#merr").textContent=x.message}};
$("#q").oninput=render;

$("#list").onclick=async e=>{
  const b=e.target.closest("[data-a]");if(!b)return;
  const slug=b.closest("li").dataset.s,l=links.find(x=>x.slug===slug),a=b.dataset.a;
  if(a==="toggle"){try{await api("links/"+slug,"PATCH",{on:b.checked});l.on=b.checked;render()}catch(x){toast(x.message);render()}}
  else if(a==="copy")toast(await copy(full(slug))?"Đã sao chép link":full(slug));
  else if(a==="del"){if(confirm(`Xoá ${H}/${slug}?\nNgười đã nhận link sẽ không mở được nữa.`)){
    try{await api("links/"+slug,"DELETE");links=links.filter(x=>x.slug!==slug);render();toast("Đã xoá link")}catch(x){toast(x.message)}}}
  else if(a==="edit"){try{const f=await api("links/"+slug);editing=slug;
    $("#eurl").value=f.url;$("#etitle").value=f.title||"";$("#eexp").value=f.exp?ymd(f.exp):"";$("#eerr").textContent="";$("#edlg").showModal()}catch(x){toast(x.message)}}
  else if(a==="qr")qr(slug);
};
$("#edit").onsubmit=async e=>{e.preventDefault();
  try{const r=await api("links/"+editing,"PATCH",{url:$("#eurl").value,title:$("#etitle").value,exp:endOf($("#eexp").value)});
    Object.assign(links.find(x=>x.slug===editing),r);render();$("#edlg").close();toast("Đã lưu thay đổi (có thể mất tới 1 phút để áp dụng toàn cầu)")}
  catch(x){$("#eerr").textContent=x.message}};
document.addEventListener("click",e=>{if(e.target.closest("[data-close]"))e.target.closest("dialog").close()});

async function qr(slug){
  try{
    if(!window.qrcode)await new Promise((ok,no)=>{const s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js";s.onload=ok;s.onerror=no;document.head.append(s)});
    const q=qrcode(0,"M");q.addData(full(slug));q.make();
    $("#qsvg").innerHTML=q.createSvgTag(8,2);$("#qtxt").textContent=full(slug);qrSlug=slug;$("#qdlg").showModal();
  }catch{toast("Không tải được thư viện tạo mã QR. Kiểm tra kết nối mạng.")}
}
$("#qdl").onclick=()=>{const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([$("#qsvg").innerHTML],{type:"image/svg+xml"}));a.download=`qr-${qrSlug}.svg`;a.click()};

api("links").then(()=>setAdmin(true)).catch(()=>setAdmin(false));
</script>
</body>
</html>
