name = "nchxa-hub"
main = "src/index.js"
compatibility_date = "2026-10-01"

# 1 Worker phục vụ toàn bộ nchxa.cyou: landing page (/), trang quản lý (/admin/) và link rút gọn (/<alias>)
routes = [{ pattern = "nchxa.cyou", custom_domain = true }]

[vars]
SHORT_HOST = "nchxa.cyou"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# Không cần điền id: Wrangler tự tạo KV Namespace ở lần deploy đầu tiên
[[kv_namespaces]]
binding = "LINKS"

# Giới hạn số link tạo từ 1IP trong 1 phút là 10
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }
